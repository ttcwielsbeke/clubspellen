<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>og:image generator — {{TITEL}}</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  body{ background:#0d1b2c; color:#cfe9ff; font:13px/1.6 system-ui, sans-serif; margin:0; padding:20px; }
  #out{ width:100%; max-width:1200px; border:2px solid #2f7fd4; border-radius:8px; display:block; }
  #stage{ position:absolute; left:-9999px; top:0; width:460px; height:860px; border:0; }
  #log{ margin-top:12px; font-family:ui-monospace, monospace; color:#9bff6e; }
</style>
</head>
<body>
<h1>og:image generator</h1>
<p>Laat het echte spel even lopen in een verborgen iframe en zet het in een kaart van 1200×630.
  Draait <code>python ../kit/tools/ogsave.py</code> vanuit de map van het spel (poort 8124), dan wordt <code>og.jpg</code> meteen
  in de repo geschreven. Hou dit tabblad zichtbaar terwijl het tekent.</p>
<canvas id="out" width="1200" height="630"></canvas>
<div id="log">bezig…</div>
<iframe id="stage" src="../index.html"></iframe>

<script src="../kit/tokens.js"></script>
<script>
const W = 1200, H = 630, T = TTCW;
const c = document.getElementById('out').getContext('2d');
const log = m => document.getElementById('log').textContent = m;
const wait = ms => new Promise(r => setTimeout(r, ms));
const img = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });

/* ---------- PAS AAN: zet het spel op een mooie stand ---------- */
async function pose(win){
  win.document.getElementById('btnStart').click();
  await wait(2500);
}
const LOGO = ['{{LOGO_REGEL1}}', '{{LOGO_REGEL2}}'];
const SUB  = 'het videospel van TTC Wielsbeke-Spotit';

async function run(){
  await document.fonts.load('40px "Press Start 2P"');
  const fr = document.getElementById('stage');
  await new Promise(r => fr.contentDocument.readyState === 'complete' ? r() : fr.onload = r);
  await pose(fr.contentWindow);
  const game = fr.contentDocument.getElementById('game');

  // achtergrond: dezelfde gloed als het spel
  const g = c.createRadialGradient(330, 300, 40, 330, 300, 900);
  g.addColorStop(0, '#1f6cc0'); g.addColorStop(.45, '#0f488a'); g.addColorStop(1, '#05203f');
  c.fillStyle = g; c.fillRect(0, 0, W, H);

  // het spel links, in een chroomkader
  const gh = 540, gw = gh * game.width / game.height, gx = 60, gy = 45;
  c.fillStyle = T.c.chrome; c.fillRect(gx - 6, gy - 6, gw + 12, gh + 12);
  c.drawImage(game, gx, gy, gw, gh);

  // logo rechts: rood en goud met harde schaduw
  const x = gx + gw + 70;
  c.font = '64px "Press Start 2P"'; c.textBaseline = 'top';
  T.shadowText(c, LOGO[0], x, 150, T.c.red, T.c.redShadow, 5);
  T.shadowText(c, LOGO[1], x, 240, T.c.gold, '#7a5b00', 5);
  c.font = '18px "Press Start 2P"'; c.fillStyle = '#bcd8f5'; c.fillText(SUB, x, 350);

  // clublogo en de drie strepen
  const logo = await img('../kit/logo/clublogo.png');
  if (logo){ c.fillStyle = '#fff'; c.fillRect(x, 410, 230, 133); c.drawImage(logo, x + 8, 414, 214, 124); }
  T.stripes(c, 0, H - 26, W, 6, 2);

  const blob = await new Promise(r => document.getElementById('out').toBlob(r, 'image/jpeg', .9));
  try {
    const res = await fetch('http://127.0.0.1:8124/og.jpg', { method: 'POST', body: blob });
    log('KLAAR — ' + await res.text());
  } catch (_){ log('KLAAR, maar ogsave.py draait niet: rechtsklik op de kaart → opslaan als og.jpg'); }
}
run().catch(e => log('fout: ' + e.message));
</script>
</body>
</html>
